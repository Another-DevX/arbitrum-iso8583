name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Foundry dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-git
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge snapshot --check

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: middleware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d middleware"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/middleware
          RELAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  security:
    name: Slither static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-git
      - run: pip install slither-analyzer
      - name: Run Slither and retain triaged findings
        run: |
          mkdir -p data
          slither_status=0
          slither . --config-file slither.config.json --json "$RUNNER_TEMP/slither-report.json" || slither_status=$?
          cp "$RUNNER_TEMP/slither-report.json" data/slither-report.json
          exit "$slither_status"
      - uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/data/slither-report.json
