services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: middleware
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d middleware"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3100:3100"
      - "5001:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/middleware
      PORT: "3100"
      TCP_PORT: "5000"
      CORS_ORIGIN: http://localhost:5173
      ENABLE_POS_WS_BRIDGE: "true"
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-15}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3100
        VITE_BACKEND_WS_URL: ws://localhost:3100
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  pgdata:
